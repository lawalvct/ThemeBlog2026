<script>
document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    const TB = window.TB;
    if (!TB) return;
    const { $, esc, url, data, card, mediaBox, kicker, meta, state, errorState, skeletonCards, icon } = TB;

    function leadHTML(p) {
        const href = esc(url.post(p.slug));
        return '<article class="tb-lead tb-reveal">' +
            '<a href="' + href + '" tabindex="-1" aria-hidden="true">' + mediaBox(p, { eager: true }) + '</a>' +
            (p.isFeatured ? '<span class="tb-card__badge">Featured</span>' : '') +
            '<div class="tb-lead__body">' + kicker(p) +
            '<h1 class="tb-lead__title"><a href="' + href + '">' + esc(p.title) + '</a></h1>' +
            (p.excerpt ? '<p class="tb-lead__excerpt">' + esc(p.excerpt) + '</p>' : '') +
            meta(p, ['author', 'date', 'read']) +
            '</div></article>';
    }

    function pickHTML(p, i) {
        const href = esc(url.post(p.slug));
        return '<article class="tb-pick tb-reveal" style="--i:' + (i + 1) + '">' +
            '<a href="' + href + '" tabindex="-1" aria-hidden="true">' + mediaBox(p) + '</a>' +
            kicker(p) +
            '<h3 class="tb-pick__title"><a href="' + href + '"><span class="tb-link-underline">' + esc(p.title) + '</span></a></h3>' +
            meta(p, ['author', 'read']) +
            '</article>';
    }

    async function loadHero() {
        const hero = $('#tbHero');
        const latest = $('#tbLatest');
        latest.innerHTML = skeletonCards(6);
        try {
            const res = await data.posts({ page: 1, limit: 13, sort: 'latest' });
            const posts = res.items;
            hero.removeAttribute('aria-busy');

            if (!posts.length) {
                hero.style.gridTemplateColumns = 'minmax(0, 1fr)';
                hero.innerHTML = state('empty', 'No stories published yet', 'As soon as posts are published in MdBlog they will appear here.');
                $('#tbLatestSection').hidden = true;
                return;
            }

            const featured = posts.filter((p) => p.isFeatured);
            const lead = featured[0] || posts[0];
            const others = posts.filter((p) => p !== lead);
            const picks = others.filter((p) => p.isFeatured).concat(others.filter((p) => !p.isFeatured)).slice(0, 3);
            const used = new Set([lead].concat(picks));
            const rest = posts.filter((p) => !used.has(p)).slice(0, 6);

            if (picks.length) {
                hero.innerHTML = leadHTML(lead) +
                    '<aside class="tb-hero__aside" aria-label="Editor’s picks">' +
                    '<div class="tb-section-head tb-hero__aside-title" style="margin-bottom:0"><h2 class="tb-section-head__title" style="font-size:1.25rem">Editor’s <em>picks</em></h2></div>' +
                    '<div class="tb-hero__aside-list">' + picks.map(pickHTML).join('') + '</div></aside>';
            } else {
                hero.style.gridTemplateColumns = 'minmax(0, 1fr)';
                hero.innerHTML = leadHTML(lead);
            }

            if (rest.length) {
                latest.innerHTML = rest.map((p, i) => card.standard(p, { index: i })).join('');
            } else {
                $('#tbLatestSection').hidden = true;
            }
        } catch (err) {
            hero.removeAttribute('aria-busy');
            hero.style.gridTemplateColumns = 'minmax(0, 1fr)';
            hero.innerHTML = errorState(err);
            $('#tbLatestSection').hidden = true;
        }
    }

    async function loadWidgets() {
        const band = $('#tbBand');
        const results = await Promise.allSettled([
            data.widget('trending', { limit: 5 }),
            data.widget('popular', { limit: 4 })
        ]);
        const trending = results[0].status === 'fulfilled' ? results[0].value : [];
        const popular = results[1].status === 'fulfilled' ? results[1].value : [];
        if (!trending.length && !popular.length) return;

        band.hidden = false;
        if (trending.length) $('#tbTrending').innerHTML = trending.map((p) => card.ranked(p)).join('');
        else $('#tbTrendingCol').hidden = true;
        if (popular.length) $('#tbPopular').innerHTML = popular.map((p, i) => card.row(p, { index: i, meta: ['date', 'views'] })).join('');
        else $('#tbPopularCol').hidden = true;
        if (!trending.length || !popular.length) band.querySelector('.tb-split').style.gridTemplateColumns = 'minmax(0, 1fr)';
    }

    function topicRowHTML(cat, posts) {
        const first = posts[0];
        const rest = posts.slice(1);
        return '<section class="tb-container tb-section tb-section--tight">' +
            '<header class="tb-section-head"><div><h2 class="tb-section-head__title">' + esc(cat.name) + '</h2>' +
            (cat.description ? '<p class="tb-section-head__sub">' + esc(cat.description) + '</p>' : '') + '</div>' +
            '<a class="tb-more-link" href="' + esc(url.category(cat.id)) + '">More in ' + esc(cat.name) + ' ' + icon('arrowRight') + '</a></header>' +
            '<div class="tb-feature-row">' + card.standard(first, { badge: false }) +
            (rest.length ? '<div class="tb-feature-row__list">' + rest.map((p, i) => card.row(p, { index: i + 1, excerpt: true })).join('') + '</div>' : '') +
            '</div></section>';
    }

    async function loadTopics() {
        let cats = [];
        try { cats = await data.categories(); } catch (e) { return; }
        if (!cats.length) return;

        const strip = $('#tbTopicStrip');
        strip.innerHTML = '<span class="tb-topic-strip__label">Topics</span>' +
            cats.map((c) => '<a class="tb-pill" href="' + esc(url.category(c.id)) + '">' + esc(c.name) + '</a>').join('');
        strip.hidden = false;

        const ordered = cats.filter((c) => c.showOnMenu).concat(cats.filter((c) => !c.showOnMenu)).slice(0, 3);
        const rows = await Promise.allSettled(ordered.map((c) => data.posts({ category: c.id, limit: 4, page: 1, sort: 'latest' })));
        $('#tbTopicRows').innerHTML = ordered.map((c, i) => {
            const r = rows[i];
            return r.status === 'fulfilled' && r.value.items.length ? topicRowHTML(c, r.value.items) : '';
        }).join('');
    }

    loadHero();
    loadWidgets();
    loadTopics();
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    const TB = window.TB;
    if (!TB || !TB.studio) return;
    const { $, api, auth, studio } = TB;

    const next = studio.safeNext(new URLSearchParams(window.location.search).get('next'));
    const goNext = () => window.location.replace(next || studio.url('Dashboard'));
    document.title = 'Sign in · Studio — ' + (TB.config.siteName || '');

    if (auth.token()) { goNext(); return; }

    const form = $('#stLoginForm');
    const errorBox = $('#stLoginError');
    const showError = (msg) => { errorBox.textContent = msg; errorBox.hidden = false; };

    // MdBlog only signs in accounts that already have a blog profile. Editors who have
    // never used MdBlog fall back to the core OCMS login; MdBlog then creates their
    // profile the first time their record is requested.
    async function signIn(email, password) {
        try {
            return { data: await api.post('blogs/auth/signin', { email: email, password: password }), core: false };
        } catch (err) {
            if (err.code !== '3018' && !/no user found/i.test(err.message || '')) throw err;
            return { data: await api.post('users/login', { username: email, password: password }), core: true };
        }
    }

    $('#stTogglePass').addEventListener('click', (e) => {
        const input = $('#stPassword');
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        e.currentTarget.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.hidden = true;
        const email = form.email.value.trim();
        const password = form.password.value;
        if (!email || !password) { showError('Enter your email or username and your password.'); return; }

        await studio.busy($('#stLoginBtn'), 'Signing in…', async () => {
            try {
                const res = await signIn(email, password);
                const data = res.data || {};
                const name = data.tokenName || TB.config.tokenName;
                const token = data[name] || data[TB.config.tokenName] || data.token;
                if (!token) { showError('Signed in, but the server did not return a session token.'); return; }

                const ltId = String(data.ltId || data.userId || '');
                const fullname = data.fullname || [data.firstName, data.surname].filter(Boolean).join(' ');
                TB.store.set(TB.config.tokenName, token);
                if (name !== TB.config.tokenName) TB.store.set(name, token);
                // Store only what the Studio needs — never password hashes or salts.
                TB.store.set(auth.detailsKey(), JSON.stringify({ ltId: ltId, username: data.username || email, fullname: fullname }));

                if (res.core && ltId) {
                    try { await TB.data.author(ltId); } catch (e) { /* profile is created on first use */ }
                }
                goNext();
            } catch (err) {
                showError(err.message || 'Sign-in failed. Check your details and try again.');
            }
        });
    });
});
</script>
